<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1498 768" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4.1 Flash benchmark comparison</title>
  <desc id="desc">Comparison chart for DeepSeek V4.1 Flash, Kimi-K3, GLM-5.3, Opus5, and GPT5.6-Sol on Terminal-Bench 3.0, DeepSWE v1.1, CyberGym, and Automation-Bench.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #ececec; stroke-width: 1; }
    .axis { stroke: #8e8e8e; stroke-width: 2; }
    .label { font: 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #333333; }
    .legend { font: 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #333333; }
    .legend-strong { font-weight: 700; fill: #5169e7; }
    .value { font: 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #333333; font-weight: 700; }
    .xlab { font: 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #333333; }
  </style>
  <rect class="bg" x="0" y="0" width="1498" height="768" rx="24" />

  <g transform="translate(86 42)">
    <rect x="126" y="-9" width="38" height="16" fill="#5568e6" />
    <text class="legend legend-strong" x="180" y="4">DeepSeek-V4.1-Flash</text>
    <rect x="472" y="-9" width="38" height="16" fill="#8f9ae8" />
    <text class="legend" x="526" y="4">Kimi-K3</text>
    <rect x="665" y="-9" width="38" height="16" fill="#a7b1ed" />
    <text class="legend" x="719" y="4">GLM-5.3</text>
    <rect x="852" y="-9" width="38" height="16" fill="#bbbbbb" />
    <text class="legend" x="906" y="4">Opus5</text>
    <rect x="1027" y="-9" width="38" height="16" fill="#d2d2d2" />
    <text class="legend" x="1081" y="4">GPT5.6-Sol</text>
  </g>

  <g transform="translate(72 92)">
    <line class="grid" x1="0" y1="0" x2="1340" y2="0" />
    <line class="grid" x1="0" y1="118" x2="1340" y2="118" />
    <line class="grid" x1="0" y1="236" x2="1340" y2="236" />
    <line class="grid" x1="0" y1="354" x2="1340" y2="354" />
    <line class="grid" x1="0" y1="472" x2="1340" y2="472" />
    <line class="axis" x1="0" y1="592" x2="1340" y2="592" />

    <g transform="translate(28 0)">
