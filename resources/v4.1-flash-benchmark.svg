        <rect x="120" y="424" width="54" height="168" fill="#a7b1ed" />
        <rect x="180" y="335" width="54" height="257" fill="#bbbbbb" />
        <rect x="240" y="388" width="54" height="204" fill="#d2d2d2" />
        <text class="value" x="8" y="404">30.0</text>
        <text class="value" x="68" y="477">17.7</text>
        <text class="value" x="128" y="414">28.3</text>
        <text class="value" x="188" y="325">43.3</text>
