      </g>

      <g transform="translate(1074 0)">
        <rect x="0" y="268" width="54" height="324" fill="#5568e6" />
        <rect x="60" y="315" width="54" height="277" fill="#8f9ae8" />
        <rect x="120" y="293" width="54" height="299" fill="#a7b1ed" />
        <rect x="180" y="284" width="54" height="308" fill="#bbbbbb" />
        <rect x="240" y="321" width="54" height="271" fill="#d2d2d2" />
        <text class="value" x="6" y="258">54.8</text>
        <text class="value" x="66" y="305">46.7</text>
